<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&amp;family=DM+Mono:wght@300;400;500&amp;display=swap');
      .name        { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 50px; fill: #F5F0E8; letter-spacing: -2px; }
      .name-accent { fill: #D97706; }
      .badge-text  { font-family: 'DM Mono', monospace; font-size: 10px; fill: #D97706; letter-spacing: 2px; }
      .meta        { font-family: 'DM Mono', monospace; font-size: 10px; fill: #4A4440; letter-spacing: 1.5px; }
      .tagline     { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 300; fill: #3A3530; }
      .code        { font-family: 'DM Mono', monospace; font-size: 14px; }
      .kw { fill: #D97706; }
      .fn { fill: #C084FC; }
      .st { fill: #86EFAC; }
      .br { fill: #5A524A; }
      .pl { fill: #F5F0E8; }

      .top-bar { transform-origin: left center; animation: expandRight 1s 0.1s cubic-bezier(.16,1,.3,1) both; }
      .bot-bar { transform-origin: left center; animation: expandRight 1s 0.3s cubic-bezier(.16,1,.3,1) both; }
      @keyframes expandRight { from { transform: scaleX(0); } to { transform: scaleX(1); } }

      .badge-group { opacity: 0; animation: fadeUp 0.5s 0.35s ease both; }
      .name-group  { opacity: 0; animation: fadeUp 0.7s 0.55s ease both; }
      .meta-group  { opacity: 0; animation: fadeUp 0.5s 0.75s ease both; }
      .tag-group   { opacity: 0; animation: fadeUp 0.5s 0.90s ease both; }
      .code-group  { opacity: 0; animation: fadeIn 0.5s 1.0s  ease both; }
      @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

      .dot-pulse { animation: pulse 2s 1.8s ease-in-out infinite; transform-origin: 70px 32px; }
      @keyframes pulse { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.3; transform:scale(.6); } }

      .ln1 { opacity:0; animation: fadeIn 0.1s 1.0s steps(1) both; }
      .ln2 { opacity:0; animation: fadeIn 0.1s 1.5s steps(1) both; }
      .ln3 { opacity:0; animation: fadeIn 0.1s 2.0s steps(1) both; }
      .ln4 { opacity:0; animation: fadeIn 0.1s 2.5s steps(1) both; }
      .ln5 { opacity:0; animation: fadeIn 0.1s 2.8s steps(1) both; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="12" fill="#161311"/>

  <!-- Horizontal rules -->
  <line x1="0" y1="58"  x2="900" y2="58"  stroke="#1E1A17" stroke-width="1"/>
  <line x1="0" y1="162" x2="900" y2="162" stroke="#1E1A17" stroke-width="1"/>

  <!-- Vertical divider -->
  <line x1="570" y1="0" x2="570" y2="220" stroke="#1E1A17" stroke-width="1"/>

  <!-- Top amber bar -->
  <rect class="top-bar" x="0" y="0" width="900" height="2" fill="#D97706"/>
  <!-- Bottom bar -->
  <rect class="bot-bar" x="0" y="219" width="900" height="1" fill="#2A2420"/>

  <!-- BADGE -->
  <g class="badge-group">
    <rect x="52" y="20" width="192" height="24" rx="12" fill="none" stroke="#2E2A26" stroke-width="1"/>
    <circle class="dot-pulse" cx="70" cy="32" r="3" fill="#D97706"/>
    <text x="82" y="36.5" class="badge-text">AVAILABLE FOR WORK</text>
  </g>

  <!-- NAME — no cursor -->
  <g class="name-group">
    <text x="52" y="124">
      <tspan class="name">Hariz Diza </tspan><tspan class="name name-accent">Santoso</tspan>
    </text>
  </g>

  <!-- META -->
  <g class="meta-group">
    <path d="M53 150 C53 145 57 141 62 141 C67 141 71 145 71 150 C71 155 62 162 62 162 C62 162 53 155 53 150 Z" fill="none" stroke="#4A4440" stroke-width="1.4"/>
    <circle cx="62" cy="149" r="2" fill="#4A4440"/>
    <text x="77" y="154" class="meta">BEKASI, INDONESIA</text>
    <line x1="214" y1="145" x2="214" y2="159" stroke="#2E2A26" stroke-width="1"/>
    <text x="224" y="154" class="meta" letter-spacing="2">JS DEVELOPER</text>
  </g>

  <!-- TAGLINE -->
  <g class="tag-group">
    <text x="52" y="182" class="tagline" fill="#2A2520">—</text>
    <text x="68" y="182" class="tagline">Building things for the web</text>
  </g>

  <!-- CODE BLOCK -->
  <text x="604" y="88"  class="code ln1"><tspan class="kw">const</tspan><tspan class="pl"> dev</tspan><tspan class="br"> = {</tspan></text>
  <text x="604" y="114" class="code ln2"><tspan class="br">  </tspan><tspan class="fn">name</tspan><tspan class="br">: </tspan><tspan class="st">"Hariz"</tspan><tspan class="br">,</tspan></text>
  <text x="604" y="140" class="code ln3"><tspan class="br">  </tspan><tspan class="fn">stack</tspan><tspan class="br">: </tspan><tspan class="st">"FullStack JS"</tspan><tspan class="br">,</tspan></text>
  <text x="604" y="166" class="code ln4"><tspan class="br">  </tspan><tspan class="fn">open</tspan><tspan class="br">: </tspan><tspan class="kw">true</tspan></text>
  <text x="604" y="192" class="code ln5"><tspan class="br">}</tspan></text>

</svg>
